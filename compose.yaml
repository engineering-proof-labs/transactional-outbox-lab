x-application: &application
  image: transactional-outbox-lab:local
  pull_policy: never
  depends_on:
    postgres:
      condition: service_healthy

x-orders-datasource: &orders-datasource
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
  SPRING_DATASOURCE_USERNAME: outbox
  SPRING_DATASOURCE_PASSWORD: outbox

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
    healthcheck:
      test: [CMD, pg_isready, -h, '127.0.0.1', -U, outbox, -d, orders]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    <<: *application
    build: .
    environment:
      <<: *orders-datasource
      SPRING_PROFILES_ACTIVE: orders
    ports:
      - '127.0.0.1:${OUTBOX_API_PORT:-8082}:8080'

  worker:
    <<: *application
    environment:
      <<: *orders-datasource
      SPRING_PROFILES_ACTIVE: worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SHIPPING_URL: http://shipping:8080

  shipping:
    <<: *application
    environment:
      <<: *orders-datasource
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipping
      SPRING_PROFILES_ACTIVE: shipping

volumes:
  postgres-data:
